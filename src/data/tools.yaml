tools:
  - name: CURPress in NVIDIA KVPress Library
    description: Prunes keys and values based on the CUR decomposition using approximate leverage scores. Integrated into NVIDIA's KVPress library for efficient LLM inference.
    link: https://github.com/NVIDIA/kvpress/
    image: /tools/kvpress.png
  - name: Selective PEFT Toolkit
    description: This toolkit provides a flexible framework for selectively fine-tuning large language models using different selective Parameter-Efficient Fine-Tuning (PEFT) methods.
    link: https://pypi.org/project/selective-optimizers/
    image: /tools/selective-peft.jpg
  - name: Collaborative Model Distillation (MPDistil)
    description: This toolkit provides a framework for distilling knowledge from large language models into smaller, more efficient models using collaborative frameworks.
    link: https://pypi.org/project/mpdistil/
    image: /tools/mpdistill.png
  - name: Manifold-Preserving Transformers (TransJect)
    description: This package contains implementations of manifold-preserving transformer architectures that maintain the geometric properties of data during transformations.
    link: https://pypi.org/project/transject/
    image: /tools/transject.png
  - name: Efficient LLM Compression Suite
    description: A comprehensive suite of tools for compressing large language models using various techniques.
    link: https://pypi.org/project/efficient-pruners
    image: /tools/prunenet.png